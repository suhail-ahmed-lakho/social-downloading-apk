name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Prebuild Android Project
        run: npx expo prebuild --platform android --clean

      - name: 🚀 Build Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 🏷️ Rename APK for Release
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/OmniSaver-${{ github.ref_name }}.apk
          cp android/app/build/outputs/apk/release/app-release.apk build-output/OmniSaver-latest.apk

      - name: 📤 Publish Release and Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build-output/*.apk
          name: OmniSaver ${{ github.ref_name }} • by Lakho's team
          draft: false
          prerelease: false
          generate_release_notes: true
