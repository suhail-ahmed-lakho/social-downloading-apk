name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Prebuild Android Project
        run: npx expo prebuild --platform android --clean

      - name: 🐘 Configure Fast Gradle Mirror
        run: |
          # Replace services.gradle.org with direct GitHub distributions mirror to prevent Cloudflare 504 timeouts
          sed -i -E 's|https\\://services\.gradle\.org/distributions/gradle-(.+)-bin\.zip|https\\://github.com/gradle/gradle-distributions/releases/download/v\1/gradle-\1-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
          echo "Verified android/gradle/wrapper/gradle-wrapper.properties:"
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📥 Pre-fetch Gradle Wrapper with Retry
        run: |
          cd android
          chmod +x gradlew
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt: Initializing Gradle wrapper..."
            ./gradlew --version && break || {
              echo "Attempt $attempt encountered network blip. Cleaning partial files and retrying in 10s..."
              rm -rf ~/.gradle/wrapper/dists/*/*/*.part ~/.gradle/wrapper/dists/*/*/*.lck 2>/dev/null || true
              sleep 10
            }
          done

      - name: 🚀 Build Release APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: ✍️ Sign and Verify APK with Release Keystore
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found at $APK_PATH"
            exit 1
          fi

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          echo "Using zipalign: $ZIPALIGN"

          # If custom keystore base64 is in GitHub secrets, decode it, otherwise use persistent release.keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          fi

          # Ensure APK is properly aligned
          if ! $ZIPALIGN -c 4 "$APK_PATH"; then
            echo "Re-aligning APK..."
            mv "$APK_PATH" "${APK_PATH}.unaligned"
            $ZIPALIGN -f -p 4 "${APK_PATH}.unaligned" "$APK_PATH"
            rm -f "${APK_PATH}.unaligned"
          fi

          # Sign with both v1 (JAR) and v2/v3 (Full APK) schemes using permanent release keystore
          echo "Signing APK with release keystore..."
          $APKSIGNER sign \
            --ks release.keystore \
            --ks-pass pass:omnisaver123 \
            --ks-key-alias omnisaver \
            --key-pass pass:omnisaver123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$APK_PATH"

          # Verify signature and print certificate fingerprints
          echo "Verifying APK signatures..."
          $APKSIGNER verify --verbose --print-certs "$APK_PATH"

      - name: 🏷️ Rename APK for Release
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/OmniSaver-${{ github.ref_name }}.apk
          cp android/app/build/outputs/apk/release/app-release.apk build-output/OmniSaver-latest.apk

      - name: 📤 Publish Release and Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build-output/*.apk
          name: OmniSaver ${{ github.ref_name }} • by Lakho's team
          draft: false
          prerelease: false
          generate_release_notes: true
